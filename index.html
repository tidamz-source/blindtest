<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15122b">
<title>Blindtest Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#15122b;--bg2:#1f1b3d;--panel:#2a2456;--line:#3a3370;
  --text:#fff;--mute:#a8a3d1;
  --red:#ff4d6d;--red-d:#b3203d;--yellow:#ffd23f;--green:#2ee59d;--blue:#4cc9f0;--violet:#9b5de5;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--panel);color:var(--text);transition:transform .08s,filter .15s,opacity .15s}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-main{background:var(--yellow);color:#1a1530}
.btn-red{background:var(--red)}
.btn-green{background:var(--green);color:#0c2a1e}
.btn-blue{background:var(--blue);color:#0a2230}
.big{font-size:20px;padding:16px 28px;border-radius:18px}
.hl{outline:3px solid var(--yellow);outline-offset:3px}
input,select{font:inherit;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.mute{color:var(--mute)}
small{color:var(--mute);font-weight:400;font-size:.6em;margin-left:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
code{background:var(--bg);padding:2px 8px;border-radius:6px;color:var(--yellow);word-break:break-all;font-size:13px}
.card a{color:var(--blue)}
.logo{font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;line-height:1}
.logo span{color:var(--yellow)}
.logo span::before{content:"●";color:var(--red);font-size:.45em;vertical-align:middle;margin:0 .15em}
.card{background:var(--bg2);border-radius:var(--r);padding:24px;border:2px solid var(--line)}
h2{font-size:24px;font-weight:800}

/* ---------- SETUP ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:36px 24px 120px;display:flex;flex-direction:column;gap:20px}
.head p{margin-top:10px;font-size:18px}
.hint{color:var(--mute);margin:8px 0 14px;font-size:14px}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--mute)}
.footer-cta{position:fixed;left:0;right:0;bottom:0;padding:16px 24px;background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center}

.conn{margin-bottom:6px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.cov{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--bg2);border:3px solid var(--line);border-radius:20px;text-align:left;font-weight:600}
.cov img,.cov .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,var(--violet),var(--red))}
.cov .cn{font-size:17px;font-weight:800;line-height:1.15}
.cov .cc{font-size:14px;color:var(--mute)}
.cov.sel{border-color:var(--yellow);background:var(--panel);transform:translateY(-3px)}
.cov.sel .cc{color:var(--yellow);font-weight:800}
details.card summary{cursor:pointer;font-size:20px;font-weight:800;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:" ▾";color:var(--mute)}
details[open].card summary::after{content:" ▴"}

/* ---------- LOBBY ---------- */
.lobby{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:48px;align-items:center}
.lobby-left{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.join-title{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.03em}
.qr{background:#fff;padding:16px;border-radius:24px;line-height:0;box-shadow:0 12px 0 rgba(0,0,0,.25)}
.qr img{width:min(32vw,340px);height:auto;image-rendering:pixelated}
.code{font-size:22px;color:var(--mute)}
.code b{color:var(--yellow);font-size:42px;letter-spacing:.12em;margin-left:8px}
.url{font-size:13px;color:var(--mute);word-break:break-all}
.lobby-right{display:flex;flex-direction:column;gap:20px;min-height:60vh}
.chips{display:flex;flex-wrap:wrap;gap:10px;flex:1;align-content:flex-start}
.chip{background:var(--panel);padding:10px 16px;border-radius:999px;font-weight:700;font-size:20px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.chip.off{opacity:.35}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* ---------- GAME (big screen) ---------- */
.stage{height:calc(100vh - 78px);display:grid;grid-template-columns:1fr 340px}
.center{display:flex;flex-direction:column;padding:32px 40px 26px;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:var(--panel);padding:10px 18px;border-radius:999px;font-size:20px}
.pill b{color:var(--yellow)}
.found{display:flex;gap:10px}
.fchip{padding:10px 16px;border-radius:999px;font-weight:800;font-size:18px;background:var(--panel);color:var(--mute)}
.fchip.ok{background:var(--green);color:#0c2a1e}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;min-height:0}
.hero-big{font-size:clamp(48px,7vw,110px);font-weight:800;letter-spacing:-.04em;line-height:1}
.eq{display:flex;gap:10px;align-items:flex-end;height:170px}
.eq i{display:block;width:26px;border-radius:10px;background:var(--violet);animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(3n){background:var(--blue)}
.eq i:nth-child(4n){background:var(--yellow)}
.eq i:nth-child(5n){background:var(--red)}
.eq i:nth-child(1){animation-delay:-.2s}.eq i:nth-child(2){animation-delay:-.7s}.eq i:nth-child(3){animation-delay:-.4s}
.eq i:nth-child(4){animation-delay:-.9s}.eq i:nth-child(5){animation-delay:-.1s}.eq i:nth-child(6){animation-delay:-.55s}
.eq i:nth-child(7){animation-delay:-.3s}.eq i:nth-child(8){animation-delay:-.8s}.eq i:nth-child(9){animation-delay:-.15s}
.eq i:nth-child(10){animation-delay:-.65s}.eq i:nth-child(11){animation-delay:-.45s}
.eq.paused i{animation-play-state:paused;opacity:.35}
@keyframes eq{0%{height:14%}50%{height:90%}100%{height:35%}}
.locked-list{color:var(--mute);font-size:18px}
.bell{font-size:90px;animation:ring .5s ease-in-out 3}
@keyframes ring{25%{transform:rotate(18deg)}75%{transform:rotate(-18deg)}}
.who{font-size:clamp(56px,8vw,130px);font-weight:800;color:var(--yellow);letter-spacing:-.04em;line-height:1}
.said{font-size:clamp(26px,3vw,44px);background:var(--bg2);border:2px solid var(--line);padding:14px 26px;border-radius:20px;max-width:90%;min-height:1.6em}
.cd{font-size:28px;color:var(--mute);font-weight:800}
.stake{font-size:clamp(28px,3.4vw,48px);font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums}
.stake small{font-size:.5em;color:var(--mute);margin-left:8px}
.verd{display:flex;gap:12px}
.verd span{padding:10px 18px;border-radius:14px;font-weight:800;font-size:22px;background:var(--panel)}
.verd .y{background:var(--green);color:#0c2a1e}
.verd .n{background:var(--red)}
.reveal{display:flex;align-items:center;gap:48px;text-align:left;max-width:100%}
.r-txt{display:flex;flex-direction:column;gap:12px;min-width:0}
.r-cover{width:min(32vw,420px);aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 22px 60px rgba(0,0,0,.55);animation:pop .5s cubic-bezier(.3,1.6,.5,1);flex:none}
.nextcd{color:var(--text);font-size:clamp(24px,2.4vw,34px);margin-top:12px;font-weight:400;letter-spacing:-.01em}
.nextcd b{color:var(--yellow);font-weight:800}
.p-cover{width:min(62vw,30svh);aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.reveal .lab{font-size:22px;color:var(--mute);text-transform:uppercase;letter-spacing:.2em}
.r-title{font-size:clamp(40px,5.6vw,92px);font-weight:800;letter-spacing:-.04em;line-height:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.r-artist{font-size:clamp(28px,3.5vw,52px);color:var(--yellow);font-weight:600;animation:pop .45s .1s cubic-bezier(.3,1.6,.5,1) both}
.by{color:var(--mute);font-size:20px}
.bar{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}
#prog{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet),var(--red));border-radius:99px}
.board{background:var(--bg2);border-left:2px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.board h3{font-size:22px}
.board ol{list-style:none;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
.board li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:var(--panel);padding:10px 14px;border-radius:14px;font-size:19px}
.board li span{color:var(--mute);font-weight:800}
.board li b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li em{font-style:normal;font-weight:800;color:var(--yellow)}
.board li.off{opacity:.4}
.board li.locked b{text-decoration:line-through;opacity:.6}
.board li.bz{background:var(--yellow);color:#1a1530}.board li.bz em,.board li.bz span{color:#1a1530}
.mini{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14px}
.mini .qr{padding:6px;border-radius:10px;box-shadow:none}
.mini .qr img{width:78px}
.mini b{color:var(--yellow);font-size:20px;letter-spacing:.1em}
.admin{position:fixed;left:0;right:0;bottom:0;height:78px;background:#0f0d20;border-top:2px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;overflow-x:auto}
.admin .sp{flex:1}
.admin .tag{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.15em;margin-right:4px;white-space:nowrap}
.admin button{white-space:nowrap}

/* ---------- END ---------- */
.end{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px}
.podium{display:flex;align-items:flex-end;gap:18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;width:200px}
.pod .n{font-size:26px;font-weight:800;text-align:center}
.pod .s{color:var(--yellow);font-weight:800;font-size:22px}
.pod .blk{width:100%;border-radius:18px 18px 0 0;display:flex;justify-content:center;padding-top:14px;font-size:48px;font-weight:800;color:#1a1530}
.pod.p1 .blk{height:240px;background:var(--yellow)}
.pod.p2 .blk{height:170px;background:var(--blue)}
.pod.p3 .blk{height:120px;background:var(--violet);color:#fff}

/* ---------- PLEIN ÉCRAN ---------- */

/* ---------- FLASH ---------- */
#flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;font-weight:800;text-align:center;padding:24px}
#flash.on{opacity:1}
#flash.good{background:rgba(46,229,157,.93);color:#0c2a1e}
#flash.bad{background:rgba(255,77,109,.93)}
#flash .ic{font-size:clamp(90px,16vw,200px);line-height:1}
#flash .tx{font-size:clamp(30px,5vw,70px);letter-spacing:-.03em}

/* ---------- PLAYER (phone) ---------- */
.pl{min-height:100svh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px}
.ptop b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop span{background:var(--panel);padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.pmid h1{font-size:30px;letter-spacing:-.02em;line-height:1.1}
.pmid p{color:var(--mute);font-size:17px;max-width:320px}
.buzz{width:min(74vw,46svh);height:min(74vw,46svh);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b93,var(--red) 55%);box-shadow:0 16px 0 var(--red-d),0 24px 50px rgba(255,77,109,.35);font-size:clamp(40px,12vw,64px);font-weight:800;letter-spacing:.02em;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,box-shadow .06s}
.buzz:active:not(:disabled),.buzz.down{transform:translateY(12px);box-shadow:0 4px 0 var(--red-d),0 10px 26px rgba(255,77,109,.3)}
.buzz.grey{background:var(--panel);box-shadow:0 16px 0 #1a1636;font-size:26px;color:var(--mute)}
.buzz:disabled{opacity:1}
.mic{width:min(52vw,32svh);height:min(52vw,32svh);border-radius:50%;background:var(--yellow);color:#1a1530;display:flex;align-items:center;justify-content:center;font-size:min(20vw,80px);position:relative}
.mic.live::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:5px solid var(--yellow);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.ptrans{font-size:24px;font-weight:700;min-height:1.4em;padding:0 8px}
.typed{display:flex;gap:8px;width:100%;max-width:420px}
.typed button{flex:none}
.pfound{display:flex;gap:8px;justify-content:center}
.pfound span{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--panel);color:var(--mute);font-weight:700}
.pfound span.ok{background:var(--green);color:#0c2a1e}
.joinbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.joinbox input{font-size:20px;padding:14px 16px;text-align:center}
.miclog{font-size:15px;color:var(--mute);min-height:1.3em}
.rank{font-size:90px;font-weight:800;color:var(--yellow);line-height:1}

@media (max-width:900px){
  .lobby{grid-template-columns:1fr;padding:28px}
  .qr img{width:min(70vw,300px)}
  .stage{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 78px)}
  .board{border-left:0;border-top:2px solid var(--line)}
  .reveal{flex-direction:column;text-align:center;gap:24px}
  .r-cover{width:min(60vw,320px)}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<script>
'use strict';
const PREFIX = 'blindtest-live-v1-';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
const QS = new URLSearchParams(location.search);
const ROOM = (QS.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const VSEP = /\s+\/\s+/;
const firstVariant = s => String(s || '').split(VSEP)[0].trim();
/* Barème dégressif : max au début de l'extrait, max × minPct à la fin (temps d'écoute, pauses exclues) */
function ptsAt(t) {
  const s = H.s, k = Math.min(1, Math.max(0, t / s.extract));
  return Math.round((s.ptsMax - s.ptsMax * (1 - s.ptsMinPct) * k) / 10) * 10;
}

/* ================= Correspondance floue des réponses ================= */
const STOP = new Set(['the','le','la','les','l','a','an','et','and','de','du','des','d','of','un','une']);
function toks(s) {
  const t = String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\(.*?\)|\[.*?\]/g, ' ')
    .replace(/\s(feat|ft)\.?\s.*$/, ' ')
    .replace(/&/g, ' et ')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim().split(' ').filter(Boolean);
  const f = t.filter(w => !STOP.has(w));
  return f.length ? f : t;
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
function matchOne(texts, target, thr) {
  const tt = toks(target), T = tt.join(''), n = tt.length;
  if (!T) return false;
  for (const txt of texts) {
    const at = toks(txt); if (!at.length) continue;
    const A = at.join('');
    if (T.length >= 5 && A.includes(T)) return true;
    for (let w = Math.max(1, n - 1); w <= n + 1; w++) {
      for (let i = 0; i + w <= at.length; i++) {
        const s = at.slice(i, i + w).join('');
        if (T.length <= 3 ? s === T : sim(s, T) >= thr) return true;
      }
    }
    if (at.length < n - 1 && T.length > 3 && sim(A, T) >= thr) return true;
  }
  return false;
}
function matchAny(texts, field, thr) {
  return String(field || '').split(VSEP).map(s => s.trim()).filter(Boolean).some(v => matchOne(texts, v, thr));
}
/* Artiste : accepte aussi le nom de famille seul pour les noms de personne (2-3 mots),
   avec une tolérance plus stricte (évite Brel/Bruel) et hors mots de groupe génériques */
const BAND_WORDS = new Set(['punk','stones','monkeys','boys','girls','brothers','sisters','band','club','crew','gang','orchestra','orchestre','family','project','kids','kings','queens','killers','doors','heads','peppers','pistols','beats','sound','system','music','stars','singers','soul','funk','rock','pop','jazz','blues','choir','chorale','groupe','group','team','collective','collectif','experience']);
function matchArtist(texts, field, thr) {
  if (matchAny(texts, field, thr)) return true;
  return String(field || '').split(VSEP).map(s => s.trim()).filter(Boolean).some(v => {
    const tt = toks(v);
    if (tt.length < 2 || tt.length > 3) return false;
    const last = tt[tt.length - 1];
    if (last.length < 4 || BAND_WORDS.has(last) || /\d/.test(last)) return false;
    return matchOne(texts, last, Math.max(thr, 0.85));
  });
}

/* ================= Sons ================= */
let actx = null;
function sfx(type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const tone = (f, d, st, wave = 'square', vol = .14) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = wave; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t + st); g.gain.exponentialRampToValueAtTime(.001, t + st + d);
      o.connect(g).connect(actx.destination); o.start(t + st); o.stop(t + st + d + .05);
    };
    if (type === 'buzz') { tone(880, .12, 0); tone(1320, .3, .1); }
    if (type === 'wrong') { tone(150, .55, 0, 'sawtooth', .22); tone(110, .55, .05, 'sawtooth', .18); }
    if (type === 'good') [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, i * .09, 'triangle', .22));
    if (type === 'join') tone(660, .12, 0, 'triangle', .12);
  } catch {}
}
let flashTimer = null;
function flash(kind, icon, text, ms = 1500) {
  const f = $('#flash');
  f.className = kind + ' on';
  f.innerHTML = `<div class="ic">${icon}</div><div class="tx">${esc(text)}</div>`;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.className = kind; }, ms);
}

/* =====================================================================

function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 5 }, () => c[Math.floor(Math.random() * c.length)]).join(''); }

}

function openRoom() {
  if (!H.pool.length || !SP.deviceId) { alert('Choisis une playlist et attends que le lecteur Spotify soit prêt.'); return; }
  if (H.peer && H.peer.open && !H.peer.destroyed) { H.phase = 'lobby'; return render(); }
  if (typeof Peer === 'undefined') { alert('La librairie de connexion (PeerJS) n’a pas pu se charger. Vérifie la connexion internet.'); return; }
  H.code = genCode();
  app.innerHTML = `<div class="end"><div class="logo">Blindtest<span>Live</span></div><p class="mute">Ouverture de la salle…</p></div>`;
  const peer = new Peer(PREFIX + H.code);
  H.peer = peer;
  peer.on('open', () => {
    H.joinUrl = location.origin + location.pathname + '?room=' + H.code;
    H.qr = makeQR(H.joinUrl);

    else console.warn('PeerJS', e.type, e);
  });
}

function onConn(conn) {
  conn.on('data', d => {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'hello') {
      const name = String(d.name || '').trim().slice(0, 20) || 'Joueur';
      const pid = String(d.pid || conn.peer).slice(0, 40);
      let p = H.players.get(pid);
      if (p) { if (p.conn && p.conn !== conn) { try { p.conn.close(); } catch {} } p.conn = conn; p.online = true; p.name = name; }
      else { p = { pid, name, score: 0, conn, online: true }; H.players.set(pid, p); sfx('join'); }
      conn._pid = pid;
      sendState(p);
      if (H.phase !== 'setup') render();
      return;
    }
    const pid = conn._pid; if (!pid) return;
    if (d.t === 'buzz') onBuzz(pid);
    else if (d.t === 'interim') onInterim(pid, d.text);
    else if (d.t === 'answer') onAnswer(pid, d.texts);
  });
  conn.on('close', () => {
    const p = H.players.get(conn._pid);
    if (p && p.conn === conn) { p.online = false; if (H.phase !== 'setup') render(); }
  });
}

    buzzerName: bz ? bz.name : null, isMe: H.buzzer === p.pid, locked: H.locked.has(p.pid),
    found: { artist: !!H.found.artist, title: !!H.found.title, hasArtist: !!(tr && tr.artist.trim()), hasTitle: !!(tr && tr.title.trim()) },
    judging: !!H.suggestion,

function startGame() {

function loadTrack(i) {

    if (H.s.startMode !== 'random' || dur <= H.s.extract + 12) return 0;

    .then(() => { H.loaded = true; if (H.phase !== 'playing') spPause(); })
    .catch(e => { flash('bad', '🎧', 'Spotify : ' + e.message, 2500); H.loaded = true; });

}

}
function onInterim(pid, text) {
  if (H.phase !== 'answering' || pid !== H.buzzer || H.suggestion) return;
  H.transcript = String(text || '').slice(0, 140);
  const el = $('#said'); if (el) el.innerHTML = H.transcript ? '« ' + esc(H.transcript) + ' »' : '<span class="mute">écoute…</span>';
}
function onAnswer(pid, texts) {
  if (H.phase !== 'answering' || pid !== H.buzzer || H.suggestion) return;
  texts = (Array.isArray(texts) ? texts : []).map(t => String(t || '').slice(0, 140)).filter(Boolean).slice(0, 6);
  H.transcript = texts[0] || '';
  const tr = H.tracks[H.idx];
  const res = {
    artist: !H.found.artist && matchArtist(texts, tr.artist, H.s.tol),
    title: !H.found.title && matchAny(texts, tr.title, H.s.tol)
  };
  H.suggestion = res;
  refresh();
  if (H.s.judge === 'auto') setTimeout(() => { if (H.suggestion === res) applyVerdict(res); }, 1400);
}
function applyVerdict(res) {
  if (H.phase !== 'answering') return;
  const pid = H.buzzer, p = H.players.get(pid);
  H.suggestion = null; H.buzzer = null;
  const gained = [], unit = ptsAt(H.buzzT);
  if (res.artist && !H.found.artist) { H.found.artist = true; H.foundBy.artist = p ? p.name : '?'; gained.push('artiste'); }
  if (res.title && !H.found.title) { H.found.title = true; H.foundBy.title = p ? p.name : '?'; gained.push('titre'); }
  if (!gained.length) {
    const lost = p ? Math.min(p.score, H.s.penalty) : 0;
    if (p) p.score -= lost;
    H.locked.add(pid);
    sfx('wrong');
    flash('bad', '✗', (p ? p.name : '') + (H.transcript ? ' — raté !' : ' — temps écoulé') + (lost ? ' −' + lost : ''));
    sendTo(pid, { t: 'verdict', ok: false, pts: -lost });
  } else {
    const won = unit * gained.length + (gained.length === 2 ? H.s.combo : 0);
    if (p) p.score += won;
    sfx('good');
    flash('good', '✓', (p ? p.name : '') + ' trouve ' + (gained.length === 2 ? 'tout' : 'le ' + gained[0]) + ' · +' + won);
    sendTo(pid, { t: 'verdict', ok: true, gained, pts: won });
  }
  if (H.found.artist && H.found.title) return revealTrack();
  const active = [...H.players.values()].filter(x => x.online);
  if (active.length && active.every(x => H.locked.has(x.pid))) return revealTrack();
  H.phase = 'playing';
  refresh();
  setTimeout(() => { if (H.phase === 'playing') E.play(); }, 1000);
}
function revealTrack() {
  H.phase = 'reveal'; H.buzzer = null; H.suggestion = null;
  H.hold = false; H.revealUntil = performance.now() + H.s.revealTime * 1000;
  if (E.paused()) E.play();
  refresh();
}
function nextTrack() {
  E.pause();
  if (H.idx + 1 < H.tracks.length) loadTrack(H.idx + 1);
  else endGame();
}
function endGame() { E.pause(); H.phase = 'end'; H.buzzer = null; H.suggestion = null; sfx('good'); refresh(); }

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  if (H.phase === 'playing' && H.loaded) {
    const el = E.time() - H.startAt;
    const pg = $('#prog'); if (pg) pg.style.width = Math.min(100, Math.max(0, el / H.s.extract * 100)) + '%';
    const sk = $('#stake'); if (sk) sk.firstChild.nodeValue = ptsAt(Math.max(0, el));
    if (el >= H.s.extract && !E.paused()) revealTrack();
  }
  if (H.phase === 'answering') {
    const cd = $('#cd');
    if (cd) cd.textContent = Math.ceil(Math.max(0, (H.deadline - now) / 1000)) + ' s';
    if (!H.suggestion && H.buzzer && now > H.deadline) applyVerdict({ artist: false, title: false });
  }
  if (H.phase === 'reveal') {
    const last = H.idx + 1 >= H.tracks.length;
    const nc = $('#nextcd');
    if (nc) {
      const txt = H.hold ? 'Enchaînement en pause' : (last ? 'Podium dans ' : 'Morceau suivant dans ') + '<b>' + Math.ceil(Math.max(0, (H.revealUntil - now) / 1000)) + ' s</b>';
      if (nc.innerHTML !== txt) nc.innerHTML = txt;
    }
    if (!H.hold && now >= H.revealUntil) nextTrack();
  }
}

/* =====================================================================
   JOUEUR : téléphone
   ===================================================================== */
const P = { pid: '', name: '', peer: null, conn: null, st: null, rec: null, sent: false, interim: '', pending: false, pendingAt: 0, tries: 0, fx: null, recFailed: false };

function playerInit() {
  P.pid = lsGet('bt_pid') || (Math.random().toString(36).slice(2) + Date.now().toString(36));
  lsSet('bt_pid', P.pid);
  P.name = lsGet('bt_name') || '';
  renderJoin();
}
function renderJoin(err) {
  app.innerHTML = `<div class="pl"><div class="pmid">
    <div class="logo">Blindtest<span>Live</span></div>
    <p>Salle <b style="color:var(--yellow);letter-spacing:.1em">${esc(ROOM)}</b></p>
    <div class="joinbox">
      <input id="nm" maxlength="20" placeholder="Ton prénom" value="${esc(P.name)}" autocomplete="nickname">
      <button class="btn-main big" id="go">Rejoindre</button>
      ${err ? `<p style="color:var(--red)">${esc(err)}</p>` : ''}
      ${SR ? '' : '<p>Ton navigateur ne gère pas la reconnaissance vocale : tu taperas tes réponses. (Chrome ou Safari recommandés.)</p>'}
    </div></div></div>`;
  const go = () => {
    const v = $('#nm').value.trim();
    if (!v) { $('#nm').focus(); return; }
    P.name = v.slice(0, 20); lsSet('bt_name', P.name);
    pMsg('Connexion…');
    connectPeer();
  };
  $('#go').onclick = go;
  $('#nm').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function pMsg(title, sub = '', retry = false) {
  app.innerHTML = `<div class="pl"><div class="pmid"><div class="logo">Blindtest<span>Live</span></div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}${retry ? '<button class="btn-main big" id="rt">Réessayer</button>' : ''}</div></div>`;
  if (retry) $('#rt').onclick = () => { P.tries = 0; pMsg('Connexion…'); connectPeer(); };
}
function connectPeer() {
  if (typeof Peer === 'undefined') return pMsg('Connexion impossible', 'La librairie réseau ne s’est pas chargée.', true);
  if (!P.peer || P.peer.destroyed) {
    P.peer = new Peer();
    P.peer.on('open', openConn);
    P.peer.on('disconnected', () => { setTimeout(() => { try { if (!P.peer.destroyed) P.peer.reconnect(); } catch {} }, 1000); });
    P.peer.on('error', e => {
      if (e.type === 'peer-unavailable') {
        if (P.st && P.tries < 8) { P.tries++; setTimeout(connectPeer, 2000); }
        else pMsg('Salle introuvable 😕', 'Vérifie que l’écran de jeu est bien ouvert, puis réessaie.', true);
      } else if (P.tries < 8) { P.tries++; setTimeout(connectPeer, 2000); }
      else pMsg('Connexion perdue', 'Vérifie ta connexion internet.', true);
    });
  } else if (P.peer.open) openConn();
}
function openConn() {
  if (P.conn && P.conn.open) return;
  const c = P.peer.connect(PREFIX + ROOM, { reliable: true });
  P.conn = c;
  c.on('open', () => { P.tries = 0; c.send({ t: 'hello', pid: P.pid, name: P.name }); });
  c.on('data', onData);
  c.on('close', () => {
    if (P.conn !== c) return;
    P.conn = null; stopRec();
    pMsg('Reconnexion…', 'La connexion avec l’écran a été coupée.');
    setTimeout(connectPeer, 1500);
  });
}
function send(o) { if (P.conn && P.conn.open) { try { P.conn.send(o); } catch {} } }

function onData(d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'state') {
    P.st = d;
    if (d.phase === 'answering') {
      P.pending = false;
      if (!d.isMe) stopRec();
    } else if (!P.pending || Date.now() - P.pendingAt > 3000) {
      P.pending = false; stopRec();
    }
    renderPlayer();
  } else if (d.t === 'buzzAck' && !d.ok) {
    P.pending = false; stopRec(); renderPlayer();
  } else if (d.t === 'verdict') {
    P.fx = d;
    try { navigator.vibrate && navigator.vibrate(d.ok ? [60, 40, 60] : 300); } catch {}
    flash(d.ok ? 'good' : 'bad', d.ok ? '✓' : '✗', d.ok ? 'Bien joué ! +' + (d.pts || 0) + ' pts (' + d.gained.join(' + ') + ')' : 'Raté !' + (d.pts ? ' ' + d.pts + ' pts' : ''), 1600);
  }
}

function startRec() {
  P.sent = false; P.interim = ''; P.recFailed = false;
  if (!SR) return;
  stopRec();
  try {
    const rec = new SR();
    rec.lang = (P.st && P.st.lang) || 'fr-FR';
    rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
    rec.onresult = e => {
      if (rec._dead) return;
      let interim = '', finals = null;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finals = Array.from(r).map(a => a.transcript);
        else interim += r[0].transcript;
      }
      if (finals) { P.interim = finals[0]; setTrans(finals[0]); sendAnswer(finals); }
      else { P.interim = interim; setTrans(interim); send({ t: 'interim', text: interim }); }
    };
    rec.onerror = e => { if (e.error !== 'aborted') P.recFailed = true; };
    rec.onend = () => {
      if (rec._dead) return;
      if (P.rec === rec) P.rec = null;
      if (!P.sent && P.interim) sendAnswer([P.interim]);
      if (P.st && P.st.phase === 'answering' && P.st.isMe) renderPlayer();
    };
    rec.start();
    P.rec = rec;
  } catch { P.recFailed = true; P.rec = null; }
}
function stopRec() { if (P.rec) { const r = P.rec; P.rec = null; r._dead = true; try { r.abort(); } catch {} } }
function sendAnswer(texts) {
  if (P.sent) return;
  P.sent = true;
  send({ t: 'answer', texts });
  if (P.rec) { try { P.rec.stop(); } catch {} }
}
function setTrans(t) { const el = $('#ptrans'); if (el) el.textContent = t ? '« ' + t + ' »' : ''; }

function doBuzz() {
  const s = P.st;
  if (P.pending || !s || s.phase !== 'playing' || s.locked) return;
  P.pending = true; P.pendingAt = Date.now();
  try { navigator.vibrate && navigator.vibrate(50); } catch {}
  startRec();
  send({ t: 'buzz' });
  renderPlayer();
}

function micTest() {
  const out = $('#miclog');
  if (!SR) { out.textContent = 'Reconnaissance vocale indisponible sur ce navigateur.'; return; }
  try {
    const r = new SR(); r.lang = (P.st && P.st.lang) || 'fr-FR'; r.interimResults = true;
    out.textContent = '🎙 Parle…';
    r.onresult = e => { out.textContent = '« ' + Array.from(e.results).map(x => x[0].transcript).join(' ') + ' »'; };
    r.onerror = e => { out.textContent = e.error === 'not-allowed' ? 'Micro refusé : autorise-le dans les réglages du navigateur.' : 'Erreur micro : ' + e.error; };
    r.onend = () => { if (out.textContent === '🎙 Parle…') out.textContent = 'Rien entendu, réessaie.'; else if (!/^Erreur|^Micro/.test(out.textContent)) out.textContent += ' ✓'; };
    r.start();
  } catch (e) { out.textContent = 'Impossible de lancer le micro.'; }
}

function renderPlayer() {
  const s = P.st; if (!s) return;
  const typedVal = ($('#typed') || {}).value || '';
  const ord = s.rank === 1 ? 'er' : 'e';
  const top = `<div class="ptop"><b>${esc(s.name)}</b><span>${s.score} pt${Math.abs(s.score) > 1 ? 's' : ''} · ${s.rank}${ord}/${s.total}</span></div>`;
  const foundChips = (s.found.hasArtist || s.found.hasTitle) ? `<div class="pfound">

      ${s.found.hasTitle ? `<span class="${s.found.title ? 'ok' : ''}">Titre ${s.found.title ? '✓' : '?'}</span>` : ''}</div>` : '';
  let mid = '';
  if (s.phase === 'lobby') {
    mid = `<h1>Tu es dans la partie ✅</h1><p>La partie va bientôt commencer sur le grand écran.</p>
      ${SR ? `<button class="btn-blue big" id="mt">🎙 Tester mon micro</button><div class="miclog" id="miclog">Teste-le maintenant pour autoriser le micro.</div>` : '<p>Pas de micro sur ce navigateur : tu pourras taper tes réponses.</p>'}`;
  } else if (s.phase === 'playing') {
    mid = `<p>Extrait ${s.trackNo} / ${s.trackCount}</p>${foundChips}
      ${s.locked ? `<button class="buzz grey" disabled>Raté 😬<br><small style="font-size:16px">attends le prochain</small></button>`
        : `<button class="buzz ${P.pending ? 'down' : ''}" id="buzz">${P.pending ? '…' : 'BUZZ'}</button>`}
      <p>${s.locked ? '' : 'Buzze dès que tu reconnais le morceau !'}</p>`;
  } else if (s.phase === 'answering' && s.isMe) {
    const live = !!P.rec;
    mid = `<div class="mic ${live ? 'live' : ''}">🎙</div>
      <h1>${s.judging ? 'Vérification…' : 'À toi !'}</h1>
      <p>${s.judging ? '' : live ? 'Dis l’artiste ou le titre' : (P.sent ? 'Réponse envoyée' : 'Micro coupé')}</p>
      <div class="ptrans" id="ptrans">${P.interim ? '« ' + esc(P.interim) + ' »' : ''}</div>
      ${!s.judging && !P.sent ? `
        ${SR && !live ? '<button class="btn-blue" id="again">🎙 Réessayer le micro</button>' : ''}
        <div class="typed"><input id="typed" placeholder="ou tape ta réponse" value="${esc(typedVal)}"><button class="btn-main" id="sendt">OK</button></div>` : ''}`;
  } else if (s.phase === 'answering') {
    mid = `<p>Extrait ${s.trackNo} / ${s.trackCount}</p>${foundChips}
      <button class="buzz grey" disabled>🔔<br>${esc(s.buzzerName || '')}<br><small style="font-size:16px">répond…</small></button>`;
  } else if (s.phase === 'reveal' && s.reveal) {
    mid = `${s.reveal.cover ? `<img class="p-cover" src="${esc(s.reveal.cover)}" alt="">` : ''}<p>C’était</p><h1 style="font-size:32px">${esc(s.reveal.title || s.reveal.artist)}</h1>
      ${s.reveal.title && s.reveal.artist ? `<p style="color:var(--yellow);font-size:22px">${esc(s.reveal.artist)}</p>` : ''}
      <p>Prochain extrait dans un instant…</p>`;
  } else if (s.phase === 'end') {
    mid = `<p>Partie terminée</p><div class="rank">${s.rank}${ord}</div><h1>${s.score} point${Math.abs(s.score) > 1 ? 's' : ''}</h1>
      ${s.podium ? `<p>${s.podium.map((p, i) => ['🥇', '🥈', '🥉'][i] + ' ' + esc(p.name) + ' (' + p.score + ')').join('<br>')}</p>` : ''}`;
  } else {
    mid = `<h1>En attente…</h1>`;
  }
  app.innerHTML = `<div class="pl">${top}<div class="pmid">${mid}</div></div>`;

  const bz = $('#buzz');
  if (bz) { bz.addEventListener('pointerdown', e => { e.preventDefault(); doBuzz(); }); bz.addEventListener('contextmenu', e => e.preventDefault()); }
  const mt = $('#mt'); if (mt) mt.onclick = micTest;
  const ag = $('#again'); if (ag) ag.onclick = () => { startRec(); renderPlayer(); };
  const st = $('#sendt');
  if (st) {
    const go = () => { const v = $('#typed').value.trim(); if (v) { stopRec(); P.interim = v; sendAnswer([v]); renderPlayer(); } };
    st.onclick = go;
    $('#typed').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
}

/* ================= Démarrage ================= */
if (ROOM) playerInit(); else hostInit();
</script>
</body>
</html>
